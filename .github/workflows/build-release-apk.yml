name: Build AGCodespace Android app

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agcodespace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify ARM64 Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout AGCodespace
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16138531 cmake;3.22.1'

      - name: Set NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16138531" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16138531" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_VERSION=30.0.16138531" >> "$GITHUB_ENV"

      - name: Build LinuxDroidapp PRoot runtime from source
        run: scripts/build-proot-runtime.sh

      - name: Verify runtime package layout
        run: |
          set -euo pipefail
          test -s app/src/main/cpp/pty_bridge.c
          test -s app/src/main/java/app/agcodespace/runtime/UbuntuInstaller.kt
          test -s app/src/main/jniLibs/arm64-v8a/libproot.so
          test -s app/src/main/jniLibs/arm64-v8a/libproot_loader.so
          test -s app/src/main/assets/runtime/RUNTIME-SHA256SUMS
          file app/src/main/jniLibs/arm64-v8a/*.so

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Configure owner-controlled release signing (optional)
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AGCODESPACE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AGCODESPACE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AGCODESPACE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AGCODESPACE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/agcodespace-upload.jks
            chmod 600 /tmp/agcodespace-upload.jks
            {
              echo "AGCODESPACE_KEYSTORE_PATH=/tmp/agcodespace-upload.jks"
              echo "AGCODESPACE_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "AGCODESPACE_KEY_ALIAS=$KEY_ALIAS"
              echo "AGCODESPACE_KEY_PASSWORD=$KEY_PASSWORD"
              echo "AGCODESPACE_SIGNING_READY=true"
            } >> "$GITHUB_ENV"
          else
            echo "AGCODESPACE_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "No release keystore configured; building an unsigned validation APK."
          fi

      - name: Assemble release APK
        run: gradle assembleRelease --no-daemon

      - name: Build Play Console AAB when release signing is configured
        if: ${{ env.AGCODESPACE_SIGNING_READY == 'true' }}
        run: gradle bundleRelease --no-daemon

      - name: Verify APK and record checksums
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          SIGNED=false
          if [[ -f app/build/outputs/apk/release/app-release.apk ]]; then
            APK=app/build/outputs/apk/release/app-release.apk
            SIGNED=true
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='app.agcodespace'"
          mkdir -p artifacts
          if [[ "$SIGNED" == true ]]; then
            cp "$APK" artifacts/AGCodespace-release.apk
          else
            cp "$APK" artifacts/AGCodespace-release-unsigned.apk
          fi
          if [[ -f app/build/outputs/bundle/release/app-release.aab ]]; then
            cp app/build/outputs/bundle/release/app-release.aab artifacts/AGCodespace-release.aab
          fi
          cp app/src/main/assets/runtime/RUNTIME-SHA256SUMS artifacts/
          (cd artifacts && sha256sum * > SHA256SUMS)

      - name: Upload APK artifact (retained for 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: AGCodespace-Android-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
