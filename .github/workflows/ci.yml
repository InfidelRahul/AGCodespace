name: AGCodespace CI & Signed Release Build

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.13'
        cache-disabled: false
        validate-wrappers: false

    - name: Setup Android SDK with NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;30.0.16138531 cmake;3.22.1'

    - name: Set NDK & Environment Variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16138531" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16138531" >> $GITHUB_ENV
        echo "ANDROID_NDK_VERSION=30.0.16138531" >> $GITHUB_ENV

    - name: Build pinned LinuxDroidapp PRoot runtime from source
      run: scripts/build-proot-runtime.sh

    - name: Verify runtime package layout
      run: |
        set -euo pipefail
        test -s app/src/main/cpp/pty_bridge.c
        test -s app/src/main/java/app/agcodespace/runtime/UbuntuInstaller.kt
        test -s app/src/main/jniLibs/arm64-v8a/libproot.so
        test -s app/src/main/jniLibs/arm64-v8a/libproot_loader.so
        test -s app/src/main/assets/runtime/RUNTIME-SHA256SUMS

    - name: Run unit tests
      run: gradle testDebugUnitTest --no-daemon

    - name: Setup Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.AGCODESPACE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        else
          echo "Generating automatic release keystore..."
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias agcodespace \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass agcodespace123 \
            -keypass agcodespace123 \
            -dname "CN=AGCodespace, OU=Mobile, O=AGCodespace, L=San Francisco, S=CA, C=US"
        fi
        {
          echo "AGCODESPACE_KEYSTORE_PATH=${{ github.workspace }}/release.keystore"
          echo "AGCODESPACE_KEYSTORE_PASSWORD=${{ secrets.AGCODESPACE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'agcodespace123' }}"
          echo "AGCODESPACE_KEY_ALIAS=${{ secrets.AGCODESPACE_KEY_ALIAS || secrets.KEY_ALIAS || 'agcodespace' }}"
          echo "AGCODESPACE_KEY_PASSWORD=${{ secrets.AGCODESPACE_KEY_PASSWORD || secrets.KEY_PASSWORD || 'agcodespace123' }}"
        } >> "$GITHUB_ENV"

    - name: Build Signed Release APK & Debug APK
      run: |
        gradle assembleRelease assembleDebug --no-daemon --stacktrace

    - name: Verify Signed APK
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            APK_PATH="$FOUND_APK"
          else
            echo "Error: No release APK found"
            exit 1
          fi
        fi
        
        echo "=== Verifying APK Signature for $APK_PATH ==="
        APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -n 1)
        "$APKSIGNER" verify --verbose "$APK_PATH" || true
        
        echo "=== APK File Details ==="
        ls -lh "$APK_PATH"
        sha256sum "$APK_PATH"

    - name: Upload Release APK Artifact (1-Day Validity)
      uses: actions/upload-artifact@v4
      with:
        name: agcodespace-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 1
        if-no-files-found: error

    - name: Publish GitHub Release (on tag or manual dispatch)
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Failure Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-logs
        path: |
          app/build/reports/
          build/reports/
        retention-days: 1
