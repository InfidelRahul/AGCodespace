name: AntigravityMobile CI & Signed Release Build

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-disabled: false
        validate-wrappers: false

    - name: Setup Android SDK with NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0 ndk;30.0.16248370 cmake;3.22.1'

    - name: Set NDK & Environment Variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/30.0.16248370" >> $GITHUB_ENV
        echo "ANDROID_NDK_VERSION=30.0.16248370" >> $GITHUB_ENV
        echo "NDK installed revision:"
        cat "$ANDROID_SDK_ROOT/ndk/30.0.16248370/source.properties" | grep Pkg.Revision || true

        # Ensure platforms/android-37 directory exists and has matching ApiLevel=37 for AGP compileSdk = 37
        for p in "$ANDROID_SDK_ROOT/platforms"/android-37*; do
          if [ -d "$p" ] && [ "$p" != "$ANDROID_SDK_ROOT/platforms/android-37" ] && [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            echo "Setting up platforms/android-37 from $p..."
            cp -r "$p" "$ANDROID_SDK_ROOT/platforms/android-37"
            sed -i 's/AndroidVersion.ApiLevel=.*/AndroidVersion.ApiLevel=37/' "$ANDROID_SDK_ROOT/platforms/android-37/source.properties" || true
          fi
        done
        echo "Platforms directory content:"
        ls -la "$ANDROID_SDK_ROOT/platforms/"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        else
          echo "Generating automatic release keystore..."
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias antigravitymobile \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass antigravitymobile123 \
            -keypass antigravitymobile123 \
            -dname "CN=AntigravityMobile, OU=Mobile, O=AntigravityMobile, L=San Francisco, S=CA, C=US"
        fi
        ls -la release.keystore

    - name: Build Signed Release APK & Debug APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'antigravitymobile123' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'antigravitymobile' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'antigravitymobile123' }}
      run: |
        ./gradlew assembleRelease assembleDebug --no-configuration-cache --stacktrace

    - name: Verify Signed APK
      run: |
        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "Signed release APK not found at $APK_PATH, checking release directory:"
          ls -la app/build/outputs/apk/release/ || true
          FOUND_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$FOUND_APK" ]; then
            APK_PATH="$FOUND_APK"
          else
            echo "Error: No release APK found"
            exit 1
          fi
        fi
        
        echo "=== Verifying APK Signature for $APK_PATH ==="
        APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
        "$APKSIGNER" verify --verbose "$APK_PATH"
        
        echo "=== APK File Details ==="
        ls -lh "$APK_PATH"
        sha256sum "$APK_PATH"

    - name: Upload Signed Release APK Artifact (1-Day Validity)
      uses: actions/upload-artifact@v4
      with:
        name: antigravity-mobile-signed-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 1
        if-no-files-found: error

    - name: Publish GitHub Release (on tag or manual dispatch)
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Failure Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-logs
        path: |
          app/build/reports/
          build/reports/
        retention-days: 1
